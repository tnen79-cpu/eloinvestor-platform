<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>اللغات والترجمات - إلو مستثمر</title>
<link href="assets/css/style.css" rel="stylesheet"/>
<style>
    body{margin:0;background:linear-gradient(180deg,#f7faf8,#eef4f0);font-family:inherit;color:#081f1a}.page{max-width:1180px;margin:34px auto;padding:0 16px}
    .hero{background:#fff;border:1px solid #e5eee8;border-radius:28px;padding:28px;box-shadow:0 18px 55px rgba(10,40,30,.07);display:flex;justify-content:space-between;gap:16px;align-items:center}
    .hero h1{margin:0 0 8px;font-size:30px;color:#073b2f}.hero p{margin:0;color:#60756e;font-weight:700}.card{background:#fff;border:1px solid #e5eee8;border-radius:26px;padding:24px;margin-top:18px;box-shadow:0 14px 40px rgba(10,40,30,.055)}
    .card h2{margin:0 0 18px;color:#073b2f}.btn{border:0;border-radius:15px;padding:12px 18px;cursor:pointer;font-weight:900;background:#007a4d;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}.btn.secondary{background:#eef6f2;color:#073b2f}
    .grid{display:grid;grid-template-columns:1fr 1fr 1fr 160px auto;gap:12px;align-items:center}input,select{height:48px;border:1px solid #dce8e1;border-radius:15px;padding:0 14px;background:#fff;font-weight:700;box-sizing:border-box;width:100%}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}th{padding:12px 14px;background:#f6faf8;color:#60756e;text-align:start;font-size:13px}td{padding:16px 14px;background:#fff;border-top:1px solid #edf4ef;border-bottom:1px solid #edf4ef}
    .badge{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900}.badge.active{background:#eafaf2;color:#007a4d}.badge.inactive{background:#fff2f0;color:#b42318}@media(max-width:900px){.hero,.grid{display:block}.grid>*{margin-bottom:10px}table{font-size:13px}}
  </style>
<link href="assets/css/language-switcher-v70.css" rel="stylesheet"/>
</head>
<body>
<main class="page">
<section class="hero"><div><h1>🌐 اللغات والترجمات</h1><p>تحكم كامل بلغات المنصة وترجمة الواجهة مثل 6Valley.</p></div><a class="btn secondary" href="admin-dashboard.html">رجوع للوحة الإدارة</a></section>
<section class="card"><h2>إضافة لغة جديدة</h2><div class="grid"><input id="langCode" placeholder="الكود مثل en"/><input id="langName" placeholder="الاسم English"/><input id="langNative" placeholder="الاسم المحلي English"/><select id="langDirection"><option value="ltr">LTR</option><option value="rtl">RTL</option></select><button class="btn" id="addLangBtn" type="button">إضافة اللغة</button></div></section>
<section class="card"><h2>اللغات الحالية</h2><table><thead><tr><th>الكود</th><th>الاسم المحلي</th><th>الاسم</th><th>الاتجاه</th><th>الحالة</th><th>الترجمة</th></tr></thead><tbody id="languagesTable"><tr><td colspan="6">جاري التحميل...</td></tr></tbody></table></section>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/supabase-rest-helper.js"></script><script src="assets/js/admin-languages-v70.js"></script>
<script src="assets/js/language-switcher-v70.js"></script>
</body>
</html>
