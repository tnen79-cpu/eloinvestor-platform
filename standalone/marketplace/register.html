<body>
<header class="header">

<main class="container page">
<section class="panel" style="max-width:760px;margin:auto">
<h1 data-i18n="register.text_006" style="margin-top:0">إنشاء حساب</h1>
<p data-i18n="register.text_007" style="color:var(--muted)">اختر نوع الحساب حتى نفعّل لك الصلاحيات المناسبة.</p>
<form action="javascript:void(0)" autocomplete="on" class="form-grid" data-register-form="" method="post">
<div class="group">
<label data-i18n="register.text_008">الاسم الكامل</label>
<input autocomplete="name" name="name" required=""/>
</div>
<div class="group">
<label data-i18n="register.text_009">نوع الحساب</label>
<select name="account_type" required="">
<option data-i18n="register.text_010" value="">اختر نوع الحساب</option>
<option data-i18n="register.text_011" value="investor">مستثمر</option>
<option data-i18n="register.text_012" value="owner">صاحب مشروع</option>
<option data-i18n="register.text_013" value="both">مستثمر وصاحب مشروع</option>
</select>
</div>
<div class="group">
<label data-i18n="register.text_014">البريد الإلكتروني</label>
<input autocomplete="email" name="email" required="" type="email"/>
</div>
<div class="group">
<label data-i18n="register.text_015">رقم الهاتف</label>
<input autocomplete="tel" name="phone" placeholder="+968"/>
</div>
<div class="group">
<label data-i18n="register.text_016">رقم الواتساب</label>
<input autocomplete="tel" data-i18n-placeholder="register.placeholder_017" name="whatsapp" placeholder="968XXXXXXXX"/>
</div>
<div class="group">
<label data-i18n="register.text_018">كلمة المرور</label>
<input autocomplete="new-password" minlength="6" minlength="8" name="password" required="" type="password"/>
</div>
<button class="btn btn-gold span2" data-i18n="register.text_019" type="submit">إنشاء الحساب</button>
</form>
</section>
</main>
<script src="assets/js/app.js?v=76.0.0"></script>
