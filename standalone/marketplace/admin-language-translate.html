<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>تعديل ترجمات اللغة - إلو مستثمر</title><link href="assets/css/style.css" rel="stylesheet"/>
<style>
    body{margin:0;background:linear-gradient(180deg,#f7faf8,#eef4f0);font-family:inherit;color:#081f1a}.page{max-width:1240px;margin:34px auto;padding:0 16px}.hero,.card{background:#fff;border:1px solid #e5eee8;border-radius:26px;padding:24px;box-shadow:0 14px 42px rgba(10,40,30,.06);margin-bottom:18px}
    .hero{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}h1{margin:0;color:#073b2f}p{color:#60756e;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:12px 18px;cursor:pointer;font-weight:900;background:#007a4d;color:#fff;text-decoration:none}.btn.secondary{background:#eef6f2;color:#073b2f}
    input{height:46px;border:1px solid #dce8e1;border-radius:15px;padding:0 14px;min-width:220px}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #edf4ef;text-align:start;vertical-align:top}th{color:#60756e;font-size:13px;background:#f7faf8}textarea{width:100%;min-height:64px;border:1px solid #dce8e1;border-radius:14px;padding:12px;box-sizing:border-box;font-family:inherit;font-weight:700}.key{font-size:12px;color:#789088;font-weight:800}.group{font-size:11px;color:#9aaea7;margin-top:4px}.source{font-weight:900;color:#0f2f27}
  </style>
<link href="assets/css/language-switcher-v70.css" rel="stylesheet"/>
</head>
<body>
<main class="page">
<section class="hero"><div><h1>تعديل ترجمات اللغة: <span id="langLabel"></span></h1><p>ترجم مفاتيح واجهة المنصة واحفظها مباشرة.</p></div><div class="toolbar"><input id="searchInput" placeholder="بحث داخل الترجمات"/><button class="btn secondary" id="autoFillBtn" type="button">تعبئة من ملف اللغة</button><button class="btn secondary" id="autoTranslateEmptyBtn" type="button">ترجمة تلقائية للفراغات</button><button class="btn secondary" id="autoTranslateAllBtn" type="button">إعادة ترجمة الظاهر</button><button class="btn" id="saveAllBtn" type="button">حفظ الكل</button><a class="btn secondary" href="admin-languages.html">رجوع</a></div></section>
<section class="card"><div id="autoTranslateStatus" style="margin-bottom:12px;font-weight:900;color:#007a4d"></div><table><thead><tr><th style="width:25%">المفتاح</th><th style="width:30%">النص الأساسي</th><th>الترجمة</th></tr></thead><tbody id="translationRows"><tr><td colspan="3">جاري التحميل...</td></tr></tbody></table></section>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/supabase-rest-helper.js"></script><script src="assets/js/admin-language-translate-v72.js"></script>
<script src="assets/js/language-switcher-v70.js"></script>
</body>
</html>
